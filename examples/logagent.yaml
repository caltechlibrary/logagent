# Example logagent configuration. Copy it to /etc/logagent/logagent.yaml (or
# name another file with --config or $LOGAGENT_CONFIG) and edit it for the host.
# The real file holds the host's addresses and is not committed.
#
# Unknown keys are an error, so a misspelled key is caught and not ignored.
# Always put address ranges in quotes.
# See logagent-config(5), `logagent help config`.

version: 1                          # the schema version; must be 1

host: caltechauthors-v13            # a label shown in reports
server: nginx                       # nginx or apache

# Where the web server's configuration comes from. Give a saved `nginx -T`
# dump, or a command to run. If neither is given for nginx, `nginx -T` is run.
config:
  dump: /var/lib/logagent/nginx-T.txt
  # command: nginx -T

# The access logs to read.
logs:
  - path: /var/log/nginx/access.log

# What sits in front of this server.
proxy:
  behind: cloudflare                # none or cloudflare
  real_ip_header: CF-Connecting-IP  # the default when behind is cloudflare
  # trusted_ranges:                 # override the module's snapshot of the
  #   - "173.245.48.0/20"           # proxy's published ranges

# Addresses that belong to us. They are counted, never stored in detail, and
# never targeted. There is no built-in default: list the Library's own
# networks, and for a cloud service only the Library's own addresses, never the
# provider's whole published range.
internal_ranges:
  - "131.215.0.0/16"                # Caltech campus
  # - "192.0.2.0/24"                # a remote site

# Path classes: how a request path is named in reports. The rules are tried in
# order and the first that matches wins; a path no rule matches gets `default`
# (it is "other" if left out). A rule has a name and either a prefix, or a
# pattern matched from the START of the path (put $ at the end to match the
# whole path). Several rules may share a name. The query string is never shown
# to a rule. These are CaltechAUTHORS's; a host with different URLs writes its
# own. Without any rules every request is one class, "other", and the report
# says so.
classes:
  default: other
  rules:
    - {name: api-iiif,        prefix: /api/iiif/}
    - {name: api-files,       pattern: '/api/records/[^/]+/(draft/)?files'}
    - {name: api-versions,    pattern: '/api/records/[^/]+/versions'}
    - {name: api-communities, pattern: '/api/records/[^/]+/communities'}
    - {name: api-record,      pattern: '/api/records/[^/]+$'}
    - {name: api-search,      prefix: /api/records}
    - {name: api-other,       prefix: /api}
    - {name: ui-files,        pattern: '/records/[^/]+/files'}
    - {name: ui-record,       pattern: '/records/[^/]+$'}
    - {name: ui-search,       prefix: /search}
    - {name: static,          pattern: '/(static|assets)/'}

# Declared automated agents this host knows about, added to logagent's own list
# (see `logagent help config`). An entry here is tried before the built-in ones,
# and one with the name of a built-in entry replaces it. `match` is text found,
# ignoring case, in the User-Agent; `declared` is true unless you say false.
# families:
#   - name: example-agent
#     match: [example-agent]

# Retention, in days.
retention:
  logrotate: /etc/logrotate.d/nginx # governs layer 1, the web server's own log
  layer1_min_days: 14               # the least the tools need
  layer1_max_days: 90               # the most policy allows
  layer2_days: 28                   # reduced events
  layer3_days: 730                  # daily aggregates

# Per-field overrides of the field table: required, optional or not_applicable.
fields:
  bot_score: optional
